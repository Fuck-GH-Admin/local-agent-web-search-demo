name: Offline regression (B01-B07)

on:
  push:
    branches:
      - feat/b01-searxng-search
      - feat/b02-httpx-fetch
      - feat/b03-parser-comparison
      - feat/b04-core-cli
      - feat/b05-fastapi-webui
      - feat/b06-agent-tool-loop
      - feat/live-quality-url-security
      - feat/b06-readiness-audit
      - feat/b07-agent-interfaces
      - feat/b08-final-validation
      - feat/b07-real-model
  pull_request:
    branches:
      - main
      - feat/b07-agent-interfaces

jobs:
  pytest:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12.13
      - run: uv sync --locked --all-extras
      - run: uv run --locked pytest -q --junitxml=reports/B06/url-security/ci-generated/pytest.xml
      - name: Generate B03 parser comparison report (G2 still manual)
        run: >-
          uv run --locked python scripts/b03-compare-fixtures.py
          --output reports/B03/ci-generated/parser-comparison.json
          --review reports/B03/ci-generated/manual-review.json
          --markdown reports/B03/ci-generated/parser-comparison.md
      - name: B04 offline CLI integration smoke
        run: uv run --locked python scripts/b04-cli-smoke.py
      - name: B05 CLI/API parity
        run: uv run --locked python scripts/b05-api-parity.py
      - name: B06 scripted tool loop smoke (no model API)
        run: uv run --locked python scripts/b06-offline-tool-smoke.py
      - name: B06 URL security regressions and real loopback sentinel
        run: uv run --locked python scripts/b06-url-security-smoke.py --output reports/B06/url-security/ci-generated/smoke.json
      - name: B07 real API launcher guards (offline; no API keys)
        run: uv run --locked pytest -q tests/unit/test_b07_launch.py
      - name: B07 shared CLI/API Agent interface regressions (offline)
        run: uv run --locked pytest -q tests/integration/test_agent_interfaces.py
      - name: B07 real SDK CLI and API loopback smoke (no paid calls)
        run: uv run --locked python scripts/b07-interfaces-smoke.py
      - name: B08 offline evidence collector (G5 remains NOT_RUN)
        run: uv run --locked python scripts/b08-validation.py
      - name: Prepare Node.js for CI syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Check vanilla JS syntax (CI only; no runtime Node dependency)
        run: node --check src/local_search_demo/web/static/app.js
      - name: Check B05 wheel includes static assets
        run: |
          uv build --wheel --out-dir dist
          uv run --locked python -c "import zipfile,glob; p=glob.glob('dist/*.whl')[0]; names=zipfile.ZipFile(p).namelist(); expected=['web/static/index.html','web/static/app.css','web/static/app.js']; assert all(any(e in n for n in names) for e in expected), names"
      - uses: actions/upload-artifact@v4
        with:
          name: b03-parser-comparison
          path: |
            reports/B03/ci-generated/parser-comparison.json
            reports/B03/ci-generated/parser-comparison.md
            reports/B03/ci-generated/manual-review.json
            reports/B04/cli-smoke.json
            reports/B05/api-tests.json
            reports/B06/tool-loop-tests.json
            reports/B07/interfaces/ci-smoke.json
            reports/B08/observations.json
            reports/B06/url-security/ci-generated/pytest.xml
            reports/B06/url-security/ci-generated/smoke.json
          if-no-files-found: error
