# B01: local-only SearXNG (no proxy, Redis, browser or database).
# Pulled official 2026.10.13-22c64b8d3 image; pin the observed digest for G1.
services:
  searxng:
    image: docker.io/searxng/searxng@sha256:9b61996edcc679fb6665290f95fda15389a14eda6060e41a25c63ab2758f2436
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - FORCE_OWNERSHIP=false
